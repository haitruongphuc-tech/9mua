# Nginx trên host cho 9mua.com + mọi Kiot *.9mua.com → app trong Docker ở 127.0.0.1:3009.
# Cài: sudo cp deploy/nginx/9mua.conf /etc/nginx/sites-available/9mua.conf
#      sudo ln -s /etc/nginx/sites-available/9mua.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# Chứng chỉ wildcard: xem docs/deploy.md (certbot DNS-01).

upstream ninemua_app {
    server 127.0.0.1:3009;
    keepalive 32;
}

# HTTP → HTTPS (giữ đường dẫn cho ACME nếu cần)
server {
    listen 80;
    listen [::]:80;
    server_name 9mua.com www.9mua.com *.9mua.com;
    return 301 https://$host$request_uri;
}

# www → tên miền gốc
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.9mua.com;
    ssl_certificate     /etc/letsencrypt/live/9mua.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9mua.com/privkey.pem;
    return 301 https://9mua.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 9mua.com *.9mua.com;

    ssl_certificate     /etc/letsencrypt/live/9mua.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9mua.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ninemua_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Mặc định: ảnh sản phẩm tối đa 10MB (SPEC-kiot.md)
    client_max_body_size 12m;

    # Route nội bộ chỉ cho cron trên VPS gọi thẳng 127.0.0.1:3009 — không bao giờ mở ra Internet.
    location /api/internal/ {
        return 404;
    }

    # Ảnh/video công khai do Nginx phục vụ trực tiếp, tên file không bao giờ trùng nên cache 1 năm.
    # Ảnh CCCD nằm ở /srv/9mua/private và KHÔNG có location nào trỏ tới.
    location /uploads/ {
        alias /srv/9mua/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Tải video Creator: tối đa 100MB (SPEC-creator.md)
    location /api/video/upload {
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/ninemua-proxy.conf;
    }

    location / {
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/ninemua-proxy.conf;
    }
}
