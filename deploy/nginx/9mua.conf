# Nginx trên host cho 9mua.com + mọi Kiot *.9mua.com → app trong Docker ở 127.0.0.1:3009.
# Cài: sudo cp deploy/nginx/9mua.conf /etc/nginx/sites-available/9mua.conf
#      sudo ln -s /etc/nginx/sites-available/9mua.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# Chứng chỉ wildcard: docs/deploy.md mục 6 (certbot + Cloudflare DNS).

# Giới hạn theo IP (T36): chống dò mật khẩu hàng loạt (password spraying) và dò SĐT đã đăng ký.
# Chỉ tính các lần GỬI form (POST); mở trang (GET) không bị giới hạn.
map $request_method $ninemua_auth_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $ninemua_auth_key zone=ninemua_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ninemua_upload:10m rate=30r/m;

upstream ninemua_app {
    server 127.0.0.1:3009;
    keepalive 32;
}

# HTTP → HTTPS (giữ đường dẫn cho ACME nếu cần)
server {
    listen 80;
    listen [::]:80;
    server_name 9mua.com www.9mua.com *.9mua.com;
    return 301 https://$host$request_uri;
}

# www → tên miền gốc
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.9mua.com;
    ssl_certificate     /etc/letsencrypt/live/9mua.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9mua.com/privkey.pem;
    return 301 https://9mua.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 9mua.com *.9mua.com;

    ssl_certificate     /etc/letsencrypt/live/9mua.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9mua.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ninemua_ssl:10m;

    # CSP, X-Frame-Options, nosniff, Referrer-Policy… do app tự gửi (src/lib/security-headers.ts);
    # ở đây chỉ thêm HSTS để không bị trùng header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    limit_req_status 429;

    # Mặc định: ảnh sản phẩm tối đa 10MB (SPEC-kiot.md)
    client_max_body_size 12m;

    # Route nội bộ chỉ cho cron trên VPS gọi thẳng 127.0.0.1:3009 — không bao giờ mở ra Internet.
    location /api/internal/ {
        return 404;
    }

    # Ảnh/video công khai do Nginx phục vụ trực tiếp, tên file không bao giờ trùng nên cache 1 năm.
    # Ảnh CCCD nằm ở /srv/9mua/private và KHÔNG có location nào trỏ tới.
    location /uploads/ {
        alias /srv/9mua/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Đăng nhập / đăng ký / quên mật khẩu: tối đa 10 lần gửi mỗi phút mỗi IP (cho phép dồn 5 lần).
    location ~ ^/(dang-nhap|dang-ky|quen-mat-khau|dat-lai-mat-khau)$ {
        limit_req zone=ninemua_auth burst=5 nodelay;
        include /etc/nginx/snippets/ninemua-proxy.conf;
    }

    # Tải ảnh sản phẩm / logo / ảnh khiếu nại: tối đa 30 lần mỗi phút mỗi IP.
    location ~ ^/api/(kiot/images|kiot/branding|orders/dispute-image)$ {
        limit_req zone=ninemua_upload burst=20 nodelay;
        include /etc/nginx/snippets/ninemua-proxy.conf;
    }

    # Nộp CCCD: 2 ảnh, mỗi ảnh ≤ 10MB (SPEC-payouts.md mục 3)
    location = /api/kyc/submit {
        client_max_body_size 25m;
        limit_req zone=ninemua_upload burst=5 nodelay;
        include /etc/nginx/snippets/ninemua-proxy.conf;
    }

    # Tải video Creator: tối đa 100MB (SPEC-creator.md)
    location /api/video/upload {
        client_max_body_size 110m;
        limit_req zone=ninemua_upload burst=5 nodelay;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        include /etc/nginx/snippets/ninemua-proxy.conf;
    }

    location / {
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/ninemua-proxy.conf;
    }
}
