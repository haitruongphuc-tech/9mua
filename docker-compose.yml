# Production trên VPS. Nginx của host proxy vào 127.0.0.1:3009 (deploy/nginx/9mua.conf).
# Chạy: docker compose up -d --build db && docker compose run --rm migrate && docker compose up -d --build
name: ninemua

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ninemua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ninemua
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ninemua -d ninemua']
      interval: 5s
      timeout: 3s
      retries: 20
    # Không mở cổng ra ngoài: chỉ app/worker trong mạng nội bộ của compose truy cập được.

  app:
    build:
      context: .
      target: runner
      args:
        APP_URL: ${APP_URL:-https://9mua.com}
    image: ninemua-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ninemua:${POSTGRES_PASSWORD}@db:5432/ninemua
      UPLOAD_DIR: /data/uploads
      PRIVATE_DIR: /data/private
    ports:
      - '127.0.0.1:${APP_PORT:-3009}:3000'
    volumes:
      - ${DATA_DIR:-/srv/9mua}/uploads:/data/uploads
      - ${DATA_DIR:-/srv/9mua}/private:/data/private
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: migrator
    image: ninemua-migrator:latest
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://ninemua:${POSTGRES_PASSWORD}@db:5432/ninemua
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
      args:
        APP_URL: ${APP_URL:-https://9mua.com}
    image: ninemua-worker:latest
    command: ['worker']
    healthcheck:
      disable: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ninemua:${POSTGRES_PASSWORD}@db:5432/ninemua
      UPLOAD_DIR: /data/uploads
      PRIVATE_DIR: /data/private
    volumes:
      - ${DATA_DIR:-/srv/9mua}/uploads:/data/uploads
      - ${DATA_DIR:-/srv/9mua}/private:/data/private
    depends_on:
      db:
        condition: service_healthy

  # Máy chủ hình cho Live (SPEC-live.md, CEO duyệt dùng MediaMTX). Image ghim đúng phiên bản.
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # App kiểm mã phát/mã xem; khoá ở ?key= trùng INTERNAL_CRON_TOKEN (Nginx chặn /api/internal từ Internet).
      MTX_AUTHHTTPADDRESS: http://app:3000/api/internal/live/media-auth?key=${INTERNAL_CRON_TOKEN}
      # IP công khai của VPS để trình duyệt gửi/nhận hình (đặt LIVE_PUBLIC_IP trong .env).
      MTX_WEBRTCADDITIONALHOSTS: ${LIVE_PUBLIC_IP:-}
    ports:
      # WHIP/WHEP chỉ mở cho Nginx trên host.
      - '127.0.0.1:8889:8889'
      # Hình và tiếng: mở ra Internet (CEO mở 8189 UDP + TCP trên tường lửa VPS).
      - '8189:8189/udp'
      - '8189:8189/tcp'
    # Cổng API 9997 KHÔNG publish: chỉ app/worker trong mạng compose gọi được.

volumes:
  db-data:
